[package]
name = "qubit-codec"
version = "0.12.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-codec"
description = "Core codec traits and buffer conversion primitives for Rust"
homepage = "https://github.com/qubit-ltd/rs-codec"
documentation = "https://docs.rs/qubit-codec"
readme = "README.md"
keywords = ["codec", "transcoder", "byteorder", "buffer", "qubit"]
categories = ["encoding", "rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/examples/**",
    "/tests/**",
    "/benches/**",
]

[package.metadata.rs-ci]
miri = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
io = ["dep:qubit-io"]

[dependencies]
thiserror = "2.0"
qubit-utils = { path = "../rs-utils", version = "0.2" }

qubit-io = { version = "0.15", path = "../rs-io", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[[bench]]
name = "transcode"
harness = false

[[test]]
name = "tests"
path = "tests/mod.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
