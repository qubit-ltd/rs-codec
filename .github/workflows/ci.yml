name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  dependency-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Check dependency baseline
        run: ./dependency-update.sh --check

  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install Rustfmt
        run: rustup component add rustfmt
      - name: Run infrastructure CI orchestration
        run: ./ci-check.sh
      - name: Install Clippy
        run: rustup component add clippy
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  prepare-feature-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate and generate feature matrix
        id: matrix
        run: |
          set -euo pipefail
          config=.infra/ci/cargo-matrix.json
          jq -e '
            .version == 1
            and (.checks | type == "array" and length > 0)
            and all(.checks[];
              (.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))
              and (.commands | type == "array" and length > 0)
              and ((if has("defaultFeatures") then .defaultFeatures else true end) | type == "boolean")
              and ((.features // []) | type == "array" and all(.[]; type == "string"))
            )
          ' "$config" > /dev/null
          matrix=$(jq -c '{include: [.checks[] | {
            name,
            commands: (.commands | join(",")),
            default_features: (if has("defaultFeatures") then .defaultFeatures else true end),
            features: ((.features // []) | join(","))
          }]}' "$config")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  feature-matrix:
    name: Feature matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare-feature-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-feature-matrix.outputs.matrix) }}
    env:
      CARGO_TARGET_DIR: target/feature-matrix/${{ matrix.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Run configured compatibility commands
        run: |
          set -euo pipefail
          cargo_args=(--locked)
          if [ "${{ matrix.default_features }}" = "false" ]; then
            cargo_args+=(--no-default-features)
          fi
          if [ -n "${{ matrix.features }}" ]; then
            cargo_args+=(--features "${{ matrix.features }}")
          fi
          IFS=, read -r -a commands <<< "${{ matrix.commands }}"
          for command in "${commands[@]}"; do
            case "$command" in
              check | build | test)
                cargo "$command" "${cargo_args[@]}"
                ;;
              doc)
                RUSTDOCFLAGS="-D warnings" cargo doc --no-deps "${cargo_args[@]}"
                ;;
              doc-test)
                cargo test --doc "${cargo_args[@]}"
                ;;
              clippy)
                rustup component add clippy
                cargo clippy --all-targets "${cargo_args[@]}" -- -D warnings
                ;;
              *)
                echo "error: unsupported configured command '$command'" >&2
                exit 1
                ;;
            esac
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.8.6 --locked
      - name: Collect and check coverage
        run: ./coverage.sh
      - name: Generate coverage reports
        run: |
          set -euo pipefail
          report_dir=target/infra/coverage
          mkdir -p "$report_dir"
          cargo llvm-cov report --html --output-dir target/llvm-cov
          cargo llvm-cov report --lcov --output-path "$report_dir/lcov.info"
          cargo llvm-cov report --json --output-path "$report_dir/coverage.json"
          cargo llvm-cov report --cobertura --output-path "$report_dir/cobertura.xml"
          cargo llvm-cov report --text | tee "$report_dir/coverage.txt"
          cp "$report_dir/coverage.json" coverage.json
          cp "$report_dir/lcov.info" lcov.info
          cp "$report_dir/coverage.txt" coverage.txt
          line_count=$(jq -r '[.data[].totals.lines.count // 0] | add // 0' coverage.json)
          line_covered=$(jq -r '[.data[].totals.lines.covered // 0] | add // 0' coverage.json)
          line_percent=$(jq -n --argjson covered "$line_covered" --argjson count "$line_count" 'if $count == 0 then 0 else $covered * 100 / $count end')
          line_percent_text=$(printf '%.2f%%' "$line_percent")
          line_percent_whole=$(printf '%.0f' "$line_percent")
          if [ "$line_count" = 0 ]; then line_percent_text=n/a; line_percent_whole=0; fi
          if [ "$line_percent_whole" -ge 90 ]; then badge_color=4c1
          elif [ "$line_percent_whole" -ge 80 ]; then badge_color=97ca00
          elif [ "$line_percent_whole" -ge 70 ]; then badge_color=dfb317
          elif [ "$line_percent_whole" -ge 60 ]; then badge_color=fe7d37
          else badge_color=e05d44; fi
          jq -n --arg message "$line_percent_text" --arg color "$badge_color" '{schemaVersion:1,label:"coverage",message:$message,color:$color}' > coverage-badge.json
          {
            echo '## Code coverage'
            echo
            echo '| Metric | Covered | Total | Coverage |'
            echo '| --- | ---: | ---: | ---: |'
            jq -r '[.data[].totals] | (map(.lines.covered // 0) | add) as $lc | (map(.lines.count // 0) | add) as $ln | (map(.functions.covered // 0) | add) as $fc | (map(.functions.count // 0) | add) as $fn | (map(.regions.covered // 0) | add) as $rc | (map(.regions.count // 0) | add) as $rn | "| Functions | \($fc) | \($fn) | \(if $fn == 0 then "n/a" else ((10000*$fc/$fn|round)/100|tostring)+"%" end) |\n| Lines | \($lc) | \($ln) | \(if $ln == 0 then "n/a" else ((10000*$lc/$ln|round)/100|tostring)+"%" end) |\n| Regions | \($rc) | \($rn) | \(if $rn == 0 then "n/a" else ((10000*$rc/$rn|round)/100|tostring)+"%" end) |"' coverage.json
            echo
            echo '- HTML, LCOV, JSON, Cobertura, text, and badge reports are available in the coverage-reports artifact.'
            echo
            echo '<details><summary>Text summary</summary>'
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
            echo
            echo '</details>'
          } | tee coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.txt
            coverage.json
            coverage-badge.json
            coverage-summary.md
            target/llvm-cov/html
            target/infra/coverage/cobertura.xml
          retention-days: 14
          if-no-files-found: error
      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- rs-infra-coverage-report -->';
            const body = `${marker}\n${fs.readFileSync('coverage-summary.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: context.issue.number, per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Build strict API documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --locked --all-features --no-deps --verbose
      - name: Upload Rust documentation
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc

  pages:
    needs: [coverage, feature-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.coverage.result == 'success' && needs.feature-matrix.result == 'success'
    outputs:
      deploy: ${{ steps.pages-config.outputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate Pages configuration
        id: pages-config
        run: |
          jq -e '.deploy | type == "boolean"' .infra/ci/pages.json >/dev/null
          echo "deploy=$(jq -r .deploy .infra/ci/pages.json)" >> "$GITHUB_OUTPUT"
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: .coverage-artifacts
      - name: Restore reports for the Pages builder
        run: |
          mkdir -p target/llvm-cov
          cp .coverage-artifacts/coverage-badge.json coverage-badge.json
          cp -R .coverage-artifacts/target/llvm-cov/html target/llvm-cov/html
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Build Pages site
        run: ./.infra/tools/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" build
      - name: Prepare Pages artifact
        run: ./.infra/tools/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" artifact
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  pages-deploy:
    if: needs.pages.outputs.deploy == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4

  advanced-verification:
    name: Infrastructure suite (${{ matrix.suite }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: miri
            os: ubuntu-latest
          - suite: miri
            os: macos-14
          - suite: address-sanitizer
            os: ubuntu-latest
          - suite: loom
            os: ubuntu-latest
          - suite: fuzz
            os: ubuntu-latest
          - suite: audit
            os: ubuntu-latest
          - suite: cross
            os: ubuntu-latest
          - suite: platform
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Install suite-specific tools
        run: |
          case "${{ matrix.suite }}" in
            audit) cargo install cargo-audit --locked ;;
            fuzz)
              rustup toolchain install nightly-2026-06-05 --profile minimal
              cargo install cargo-fuzz --version 0.13.2 --locked
              ;;
            cross) cargo install cross --locked ;;
            miri)
              rustup toolchain install nightly-2026-06-05 --profile minimal --component miri,rust-src
              cargo +nightly-2026-06-05 miri setup
              ;;
            address-sanitizer) rustup toolchain install nightly-2026-06-05 --profile minimal --component rust-src ;;
          esac
      - name: Run configured infrastructure suite
        if: matrix.suite != 'miri'
        run: |
          if [ "${{ matrix.suite }}" = "loom" ]; then
            export RUSTFLAGS="--cfg loom"
          fi
          ./.infra/tools/infra-tool.sh rs-infra-verify --project "$GITHUB_WORKSPACE" run --suite "${{ matrix.suite }}"
      - name: Run Miri on the pinned nightly
        if: matrix.suite == 'miri'
        run: cargo +nightly-2026-06-05 miri test --locked --workspace --all-features
      - name: Build and smoke-test fuzz targets
        if: matrix.suite == 'fuzz'
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf -- "$tmp"' EXIT
          mapfile -t targets < <(cargo fuzz list)
          ((${#targets[@]} > 0))
          for target in "${targets[@]}"; do
            cargo +nightly-2026-06-05 fuzz build "$target"
            corpus=("$tmp/corpus/$target")
            mkdir -p "${corpus[0]}" "$tmp/artifacts/$target"
            if [ -d "fuzz/corpus/$target" ]; then corpus+=("fuzz/corpus/$target"); fi
            cargo +nightly-2026-06-05 fuzz run "$target" "${corpus[@]}" -- \
              -max_total_time=10 -max_len=4096 "-artifact_prefix=$tmp/artifacts/$target/"
          done

  publish-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Prepare local path dependencies
        run: ./.infra/tools/prepare-local-path-dependencies.sh
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94
      - name: Verify publishable Cargo package
        run: cargo package --locked --package qubit-codec --allow-dirty
      - name: Check README dependency versions
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qubit-codec") | .version' | cut -d. -f1,2)
          version_regex=${version//./\\.}
          for readme in README.md README.zh_CN.md; do
            if grep -En 'qubit-codec[[:space:]]*=[[:space:]]*("|[{][^}]*version[[:space:]]*=[[:space:]]*")' "$readme" | grep -Ev "(\"$version_regex\"|version[[:space:]]*=[[:space:]]*\"$version_regex\")"; then
              echo "README dependency version does not match $version" >&2
              exit 1
            fi
          done
      - name: Build release binary
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: cargo build --locked --release --verbose
